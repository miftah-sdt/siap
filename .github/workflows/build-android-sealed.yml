name: Build Android (DoveRunner sealed)

# Pipeline: Flutter release APK -> AppSealing_CI_Integration_Tool_latest -> artifact ter-seal.
#
# Prasyarat:
#   1. Unduh AppSealing_CI_Integration_Tool_latest dari DoveRunner Console
#      (Organization -> Third party -> CLI Tool for Android AppSealing)
#   2. GitHub Secrets (Settings -> Secrets and variables -> Actions):
#      - DOVERUNNER_AUTH_KEY   (CLI Key dari CLI Key.txt)
#      - SIAP_API_URL          (opsional, URL API produksi)
#   3. sealing.jar (~2.5 MB) — TIDAK bisa di secret GitHub (batas 64 KB).
#      Pilih salah satu (lihat docs/ANDROID_DOVERUNNER_CI.md):
#        A) GitHub Release tag "doverunner-tools" + asset sealing.jar  (disarankan)
#        B) git add -f android/doverunner/sealing.jar (repo private)
#        C) Secret DOVERUNNER_SEALING_JAR_URL (URL unduh jar)
#   3. Keystore com.miftah.siap sudah diregistrasi di DoveRunner Console (app_signing=registered_key)
#   4. Opsi use_callback_feature=true (Monitoring Mode) — sudah di ThreatReceiver.kt
#
# Jalankan: Actions -> "Build Android (DoveRunner sealed)" -> Run workflow
#
# Docs: docs/ANDROID_DOVERUNNER_CI.md
# Secrets opsional DOVERUNNER_API_URL — default script: https://api.appsealing.com/covault/gw

on:
  workflow_dispatch:
    inputs:
      deploymode:
        description: 'deploymode: test (watermark) / release (produksi)'
        required: true
        default: release
        type: choice
        options:
          - test
          - release
      use_callback:
        description: 'Monitoring Mode (broadcast threat, bukan kill app)'
        required: true
        default: true
        type: boolean
      app_signing:
        description: 'app_signing: registered_key (disarankan) / none'
        required: true
        default: registered_key
        type: choice
        options:
          - registered_key
          - none
      api_base_url:
        description: 'API URL opsional, contoh https://.../v1'
        required: false
        type: string

concurrency:
  group: build-android-sealed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-sealed-apk:
    name: Build & seal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cek prasyarat secrets
        env:
          AUTH: ${{ secrets.DOVERUNNER_AUTH_KEY }}
        run: |
          set -e
          if [ -z "$AUTH" ]; then
            echo "::error::Secret DOVERUNNER_AUTH_KEY belum di-set."
            exit 1
          fi
          echo "DOVERUNNER_AUTH_KEY OK."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve API URL
        id: api
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          SECRET_URL: ${{ secrets.SIAP_API_URL }}
        run: |
          RAW_URL="${INPUT_URL:-$SECRET_URL}"
          RAW_URL="$(echo "$RAW_URL" | sed 's/[[:space:]]//g' | sed 's#/$##')"
          if [ -z "$RAW_URL" ]; then
            RAW_URL="https://knowledgestorm-arizona-campaigns-proportion.trycloudflare.com/v1"
            echo "::warning::API URL kosong, pakai default $RAW_URL"
          fi
          echo "url=$RAW_URL" >> "$GITHUB_OUTPUT"

      - name: Decode keystore (release signing sebelum seal)
        if: hashFiles('android/key.properties') == ''
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 tidak ada — build pakai debug signing."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/siap-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KS_PW
          keyPassword=$KEY_PW
          keyAlias=$KEY_ALIAS
          storeFile=siap-release.keystore
          EOF

      - name: Build Flutter release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api.outputs.url }} \
            --dart-define=ENABLE_THREAT_REPORTING=true

      - name: Siapkan DoveRunner CLI (sealing.jar)
        env:
          JAR_URL: ${{ secrets.DOVERUNNER_SEALING_JAR_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android/doverunner
          DEST="android/doverunner/sealing.jar"

          if [ -f "$DEST" ]; then
            echo "Pakai sealing.jar dari checkout repo."
          elif [ -n "$JAR_URL" ]; then
            echo "Unduh sealing.jar dari DOVERUNNER_SEALING_JAR_URL ..."
            curl -fsSL "$JAR_URL" -o "$DEST"
          elif gh release view doverunner-tools --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Unduh sealing.jar dari GitHub Release doverunner-tools ..."
            gh release download doverunner-tools \
              --repo "${{ github.repository }}" \
              --pattern 'sealing.jar' \
              --dir android/doverunner \
              --clobber
          else
            echo "::error::sealing.jar tidak ditemukan (~2.5 MB, tidak muat GitHub Secret 64 KB)."
            echo "Pilih salah satu:"
            echo "  A) gh release create doverunner-tools sealing.jar (lihat docs/ANDROID_DOVERUNNER_CI.md)"
            echo "  B) git add -f android/doverunner/sealing.jar (repo private)"
            echo "  C) Secret DOVERUNNER_SEALING_JAR_URL = URL unduh jar"
            exit 1
          fi

          test -s "$DEST"
          java -version
          ls -la "$DEST"
          test -f android/doverunner/config.txt.example

      - name: Seal APK (java -jar sealing.jar -config config.txt)
        env:
          DOVERUNNER_AUTH_KEY: ${{ secrets.DOVERUNNER_AUTH_KEY }}
          DOVERUNNER_API_URL: ${{ secrets.DOVERUNNER_API_URL }}
          DOVERUNNER_DEPLOY_MODE: ${{ github.event.inputs.deploymode }}
          DOVERUNNER_USE_CALLBACK: ${{ github.event.inputs.use_callback }}
          DOVERUNNER_APP_SIGNING: ${{ github.event.inputs.app_signing }}
          DOVERUNNER_SEALING_PRESET_NAME: ${{ secrets.DOVERUNNER_SEALING_PRESET_NAME }}
          DOVERUNNER_SEALING_JAR: android/doverunner/sealing.jar
        run: bash android/scripts/doverunner-seal.sh

      - name: Sign sealed APK (jika app_signing=none)
        if: github.event.inputs.app_signing == 'none'
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ ! -f android/app/siap-release.keystore ]; then
            echo "::error::app_signing=none butuh ANDROID_KEYSTORE_* secrets."
            exit 1
          fi
          APKS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKS" sign \
            --ks android/app/siap-release.keystore \
            --ks-pass "pass:$KS_PW" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PW" \
            --out build/app/outputs/flutter-apk/app-release-sealed-signed.apk \
            build/app/outputs/flutter-apk/app-release-sealed.apk
          mv build/app/outputs/flutter-apk/app-release-sealed-signed.apk \
            build/app/outputs/flutter-apk/app-release-sealed.apk

      - name: Upload sealed APK
        uses: actions/upload-artifact@v5
        with:
          name: sealed-apk-${{ github.event.inputs.deploymode }}
          path: build/app/outputs/flutter-apk/app-release-sealed.apk
          retention-days: 14

      - name: Upload unsealed APK (referensi)
        uses: actions/upload-artifact@v5
        with:
          name: unsealed-apk-reference
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: ignore
